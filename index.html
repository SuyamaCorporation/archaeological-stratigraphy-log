<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archaeological Stratigraphy Logger</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4">
  <header class="text-center py-6">
    <h1 class="text-3xl font-bold text-stone-800">⛏️ Archaeological Stratigraphy Logger</h1>
    <p class="text-stone-600 mt-1">Document excavation layers, artifacts, and generate Harris matrix diagrams</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: Form + Controls -->
    <div class="lg:col-span-1 space-y-4">
      <!-- Site Info -->
      <div class="bg-white rounded-2xl shadow p-4 border border-stone-200">
        <h2 class="font-semibold text-stone-700 mb-3">Site Information</h2>
        <input id="siteName" type="text" placeholder="Site Name / Grid Ref" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-stone-400">
        <input id="excavator" type="text" placeholder="Excavator Name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
      </div>

      <!-- Add Layer Form -->
      <div class="bg-white rounded-2xl shadow p-4 border border-stone-200">
        <h2 class="font-semibold text-stone-700 mb-3">Add Stratum</h2>
        <div class="space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500">Context No.</label>
              <input id="contextNo" type="text" placeholder="001" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
            </div>
            <div>
              <label class="text-xs text-gray-500">Type</label>
              <select id="layerType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
                <option value="deposit">Deposit</option>
                <option value="cut">Cut</option>
                <option value="fill">Fill</option>
                <option value="structure">Structure</option>
                <option value="surface">Surface</option>
                <option value="intrusion">Intrusion</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500">Top Depth (cm)</label>
              <input id="depthTop" type="number" placeholder="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
            </div>
            <div>
              <label class="text-xs text-gray-500">Bottom Depth (cm)</label>
              <input id="depthBottom" type="number" placeholder="30" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500">Soil Type / Munsell Color</label>
            <input id="soilType" type="text" placeholder="e.g. Sandy loam, 10YR 4/2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
          </div>
          <div>
            <label class="text-xs text-gray-500">Period / Date Range</label>
            <input id="period" type="text" placeholder="e.g. Medieval, 1200–1400 CE" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
          </div>
          <div>
            <label class="text-xs text-gray-500">Artifacts (comma separated)</label>
            <input id="artifacts" type="text" placeholder="pottery sherd, iron nail, bone" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
          </div>
          <div>
            <label class="text-xs text-gray-500">Above (earlier context nos, comma sep)</label>
            <input id="aboveCtx" type="text" placeholder="e.g. 002,003" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
          </div>
          <div>
            <label class="text-xs text-gray-500">Notes / Photo Ref</label>
            <textarea id="layerNotes" rows="2" placeholder="Observations, photo IMG_0123..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-400"></textarea>
          </div>
          <button onclick="addLayer()" class="w-full bg-stone-700 hover:bg-stone-800 text-white font-semibold py-2 rounded-lg text-sm transition">+ Add Stratum</button>
        </div>
      </div>

      <!-- Export -->
      <button onclick="exportReport()" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-semibold py-2 rounded-lg text-sm transition">📄 Export Sequence Report</button>
    </div>

    <!-- Right: Visualization -->
    <div class="lg:col-span-2 space-y-4">
      <!-- Harris Matrix -->
      <div class="bg-white rounded-2xl shadow p-4 border border-stone-200">
        <h2 class="font-semibold text-stone-700 mb-3">Harris Matrix</h2>
        <div id="harrisMatrix" class="min-h-24 flex flex-wrap gap-2 items-start"></div>
      </div>

      <!-- Section Profile -->
      <div class="bg-white rounded-2xl shadow p-4 border border-stone-200">
        <h2 class="font-semibold text-stone-700 mb-3">Section Profile</h2>
        <div id="sectionProfile" class="overflow-x-auto"></div>
      </div>

      <!-- Layer List -->
      <div class="bg-white rounded-2xl shadow p-4 border border-stone-200">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-stone-700">Stratigraphic Log</h2>
          <span id="layerCount" class="text-xs text-gray-400"></span>
        </div>
        <div id="layerList" class="space-y-2 max-h-96 overflow-y-auto"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SOIL_COLORS = {
  deposit: '#c5a68e', cut: '#e8d5c4', fill: '#b8a090',
  structure: '#9e9e9e', surface: '#d4c5a9', intrusion: '#e8b4a0'
};

const TYPE_BADGES = {
  deposit: 'bg-amber-100 text-amber-800',
  cut: 'bg-orange-100 text-orange-800',
  fill: 'bg-stone-100 text-stone-800',
  structure: 'bg-gray-100 text-gray-800',
  surface: 'bg-green-100 text-green-800',
  intrusion: 'bg-red-100 text-red-800'
};

let layers = JSON.parse(localStorage.getItem('strata_layers') || '[]');

function save() { localStorage.setItem('strata_layers', JSON.stringify(layers)); }

function addLayer() {
  const contextNo = document.getElementById('contextNo').value.trim();
  const depthTop = parseFloat(document.getElementById('depthTop').value) || 0;
  const depthBottom = parseFloat(document.getElementById('depthBottom').value) || 0;

  if (!contextNo) { alert('Context number required'); return; }
  if (layers.find(l => l.contextNo === contextNo)) { alert('Context number already exists'); return; }

  const layer = {
    id: Date.now().toString(),
    contextNo,
    type: document.getElementById('layerType').value,
    depthTop,
    depthBottom,
    soilType: document.getElementById('soilType').value.trim(),
    period: document.getElementById('period').value.trim(),
    artifacts: document.getElementById('artifacts').value.split(',').map(a=>a.trim()).filter(Boolean),
    above: document.getElementById('aboveCtx').value.split(',').map(a=>a.trim()).filter(Boolean),
    notes: document.getElementById('layerNotes').value.trim(),
    date: new Date().toISOString().split('T')[0]
  };

  layers.push(layer);
  save();
  render();

  // Reset
  ['contextNo','depthTop','depthBottom','soilType','period','artifacts','aboveCtx','layerNotes']
    .forEach(id => document.getElementById(id).value = '');
}

function deleteLayer(id) {
  if (confirm('Delete this stratum?')) {
    layers = layers.filter(l => l.id !== id);
    save();
    render();
  }
}

function render() {
  renderHarrisMatrix();
  renderSectionProfile();
  renderLayerList();
  document.getElementById('layerCount').textContent = `${layers.length} context${layers.length !== 1 ? 's' : ''}`;
}

function renderHarrisMatrix() {
  const container = document.getElementById('harrisMatrix');
  if (layers.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-sm italic">Add strata to see Harris matrix</p>';
    return;
  }

  // Sort by depth top
  const sorted = [...layers].sort((a, b) => a.depthTop - b.depthTop);

  // Simple matrix: boxes with arrows for "above" relationships
  container.innerHTML = `<svg class="w-full" style="min-height:${Math.max(120, layers.length * 60)}px" id="harrisSvg"></svg>`;
  const svg = document.getElementById('harrisSvg');
  const W = svg.parentElement.offsetWidth - 32;

  const positions = {};
  sorted.forEach((layer, i) => {
    const col = i % Math.max(1, Math.floor(W / 110));
    const row = Math.floor(i / Math.max(1, Math.floor(W / 110)));
    positions[layer.contextNo] = { x: col * 110 + 10, y: row * 70 + 10, layer };
  });

  let svgContent = '';
  const maxY = Math.max(...Object.values(positions).map(p => p.y)) + 70;
  svg.setAttribute('viewBox', `0 0 ${W} ${maxY}`);
  svg.setAttribute('height', maxY);

  // Draw arrows for "above" relationships
  for (const [ctx, pos] of Object.entries(positions)) {
    const layer = pos.layer;
    for (const aboveCtx of layer.above) {
      const target = positions[aboveCtx];
      if (target) {
        const x1 = pos.x + 45, y1 = pos.y + 35;
        const x2 = target.x + 45, y2 = target.y;
        svgContent += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>`;
      }
    }
  }

  // Draw boxes
  for (const [ctx, pos] of Object.entries(positions)) {
    const color = SOIL_COLORS[pos.layer.type] || '#ccc';
    svgContent += `<rect x="${pos.x}" y="${pos.y}" width="90" height="35" rx="6" fill="${color}" stroke="#78716c" stroke-width="1"/>`;
    svgContent += `<text x="${pos.x + 45}" y="${pos.y + 14}" text-anchor="middle" font-size="11" font-weight="bold" fill="#292524">${ctx}</text>`;
    svgContent += `<text x="${pos.x + 45}" y="${pos.y + 27}" text-anchor="middle" font-size="9" fill="#57534e">${pos.layer.type}</text>`;
  }

  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>${svgContent}`;
}

function renderSectionProfile() {
  const container = document.getElementById('sectionProfile');
  if (layers.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-sm italic">Add strata to see section profile</p>';
    return;
  }

  const sorted = [...layers].sort((a,b) => a.depthTop - b.depthTop);
  const maxDepth = Math.max(...layers.map(l => l.depthBottom));
  const W = 500, H = 200;
  const scaleY = (H - 20) / (maxDepth || 1);

  let bars = '';
  const barW = Math.floor((W - 80) / sorted.length);

  sorted.forEach((layer, i) => {
    const x = 60 + i * barW;
    const y = 10 + layer.depthTop * scaleY;
    const h = Math.max(4, (layer.depthBottom - layer.depthTop) * scaleY);
    const color = SOIL_COLORS[layer.type] || '#ccc';
    bars += `<rect x="${x}" y="${y}" width="${barW - 2}" height="${h}" fill="${color}" stroke="#78716c" stroke-width="0.5"/>`;
    bars += `<text x="${x + barW/2}" y="${y + h/2 + 4}" text-anchor="middle" font-size="8" fill="#292524">${layer.contextNo}</text>`;
  });

  // Y axis
  let yAxis = '';
  for (let d = 0; d <= maxDepth; d += Math.ceil(maxDepth / 5)) {
    const y = 10 + d * scaleY;
    yAxis += `<line x1="55" y1="${y}" x2="${W}" y2="${y}" stroke="#e7e5e4" stroke-width="0.5"/>`;
    yAxis += `<text x="50" y="${y + 3}" text-anchor="end" font-size="8" fill="#78716c">${d}cm</text>`;
  }

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:${H}px">
    ${yAxis}${bars}
    <text x="10" y="${H/2}" transform="rotate(-90,10,${H/2})" text-anchor="middle" font-size="9" fill="#78716c">Depth</text>
  </svg>`;
}

function renderLayerList() {
  const container = document.getElementById('layerList');
  if (layers.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-sm italic text-center py-4">No strata logged yet</p>';
    return;
  }

  const sorted = [...layers].sort((a,b) => a.depthTop - b.depthTop);
  container.innerHTML = sorted.map(layer => `
    <div class="border border-stone-200 rounded-xl p-3 bg-stone-50">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span class="font-bold text-stone-800">Context ${layer.contextNo}</span>
            <span class="text-xs px-2 py-0.5 rounded-full ${TYPE_BADGES[layer.type] || 'bg-gray-100'}">${layer.type}</span>
            <span class="text-xs text-gray-500">${layer.depthTop}–${layer.depthBottom}cm</span>
            ${layer.period ? `<span class="text-xs text-amber-700">${layer.period}</span>` : ''}
          </div>
          ${layer.soilType ? `<p class="text-xs text-gray-600">🪨 ${layer.soilType}</p>` : ''}
          ${layer.artifacts.length > 0 ? `<p class="text-xs text-gray-600 mt-1">🏺 ${layer.artifacts.join(', ')}</p>` : ''}
          ${layer.above.length > 0 ? `<p class="text-xs text-gray-500 mt-1">↑ Above: ${layer.above.join(', ')}</p>` : ''}
          ${layer.notes ? `<p class="text-xs text-gray-500 mt-1 italic">${layer.notes}</p>` : ''}
        </div>
        <button onclick="deleteLayer('${layer.id}')" class="text-gray-400 hover:text-red-500 text-xs shrink-0">✕</button>
      </div>
    </div>`).join('');
}

function exportReport() {
  if (layers.length === 0) { alert('No strata to export'); return; }
  const site = document.getElementById('siteName').value || 'Unknown Site';
  const ex = document.getElementById('excavator').value || 'Unknown';
  const sorted = [...layers].sort((a,b) => a.depthTop - b.depthTop);

  let report = `STRATIGRAPHIC SEQUENCE REPORT\n`;
  report += `Site: ${site}\nExcavator: ${ex}\nDate: ${new Date().toLocaleDateString()}\n`;
  report += `Total Contexts: ${layers.length}\n\n`;
  report += `${'='.repeat(50)}\n\n`;

  sorted.forEach(layer => {
    report += `CONTEXT ${layer.contextNo} [${layer.type.toUpperCase()}]\n`;
    report += `Depth: ${layer.depthTop}–${layer.depthBottom}cm\n`;
    if (layer.soilType) report += `Soil: ${layer.soilType}\n`;
    if (layer.period) report += `Period: ${layer.period}\n`;
    if (layer.artifacts.length) report += `Artifacts: ${layer.artifacts.join(', ')}\n`;
    if (layer.above.length) report += `Stratigraphically above: ${layer.above.join(', ')}\n`;
    if (layer.notes) report += `Notes: ${layer.notes}\n`;
    report += `\n`;
  });

  const blob = new Blob([report], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `stratigraphy-report-${site.replace(/\s+/g,'-').toLowerCase()}.txt`;
  a.click();
}

render();
</script>
</body>
</html>
